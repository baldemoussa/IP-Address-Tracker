<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Address Tracker</title>
  <link rel="stylesheet" href="style.css">
   <script src="./dist/index.js" type="module"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <!-- Make sure you put this AFTER Leaflet's CSS -->
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     <script type="importmap"> { "imports": { "leaflet": "https://esm.sh" } } </script>
</head>
<body>

  <header class="hero-header">
    <h1>IP Address Tracker</h1>    
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search for any IP address or domain" value="8.8.8.8">
      <button id="search-btn" aria-label="Search IP">
        <img src="images/icon-arrow.svg" alt="Search Icon">
      </button>
      
    </div>
    <div id="error-message"></div>

    <div class="info-card">
      <div class="info-column">
        <span class="info-label">IP Address</span>
        <p class="info-data" id="ip-display">IP Address Loading ...</p>
      </div>
      <div class="info-column">
        <span class="info-label">Location</span>
        <p class="info-data" id="location-display">Location Loading ... </p>
      </div>
      <div class="info-column">
        <span class="info-label">Timezone</span>
        <p class="info-data" id="timezone-display">Timezone Loading ...</p>
      </div>
      <div class="info-column">
        <span class="info-label">ISP</span>
        <p class="info-data" id="isp-display">ISP Loading ...</p>
      </div>
    </div>
  </header>

  <div id="map"></div>
</body>
</html>
